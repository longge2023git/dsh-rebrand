# deepseek-ru.org -> DSH gateway (dsh/new-api-deepseek) on 127.0.0.1:3105
# Cloudflare proxies this host (Full (strict)); the origin certificate is the
# Cloudflare Origin CA pair stored at custom/credentials/deepseek-ru.org/.
# Deployed copy: /etc/nginx/conf.d/deepseek-ru.conf

server {
    listen 80;
    listen [::]:80;
    server_name deepseek-ru.org www.deepseek-ru.org;
    return 301 https://deepseek-ru.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.deepseek-ru.org;

    ssl_certificate     /etc/ssl/cloudflare/deepseek-ru.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/deepseek-ru.org.key;
    return 301 https://deepseek-ru.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deepseek-ru.org;

    ssl_certificate     /etc/ssl/cloudflare/deepseek-ru.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/deepseek-ru.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;
    client_body_timeout  120s;

    access_log /var/log/nginx/dsh-gateway-ru.access.log;
    error_log  /var/log/nginx/dsh-gateway-ru.error.log;

    # Cloudflare edge ranges (https://www.cloudflare.com/ips/). The client address
    # comes from CF-Connecting-IP so rate limits and logs key on the user, not the edge.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Read-only installers; uploaded out of band.
    location /downloads/ {
        alias /opt/dsh-gateway-ru/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE and long-running agent turns
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_cache              off;
        proxy_connect_timeout    30s;
        proxy_send_timeout       900s;
        proxy_read_timeout       900s;
    }
}
