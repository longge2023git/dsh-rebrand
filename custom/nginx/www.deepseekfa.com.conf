# www.deepseekfa.com -> static marketing site; the apex stays the gateway.
server {
    listen 80;
    listen [::]:80;
    server_name www.deepseekfa.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.deepseekfa.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.deepseekfa.com;

    ssl_certificate     /etc/letsencrypt/live/deepseekfa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepseekfa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/fa-site;
    error_page 404 /404.html;
    index index.html;

    # Pretty URLs: /download -> download.html, /en/docs -> en/docs.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed installer files: long cache, no directory listing.
    location /downloads/ {
        alias /var/www/fa-site/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
