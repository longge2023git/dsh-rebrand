# vvworker.51vv.com -> DSH Gateway (new-api-deepseek)
# 上游：172.21.2.58:8008（vvworker-newapi 容器 3000）
# 合并自 ds.openrouters.org 的生产配置和本次 SSE 调整；部署到 51vv 前置 nginx。
# 需要替换：证书路径、日志路径。nginx < 1.25.1 保持 listen ... http2 写法。

upstream vvworker_gateway {
    server 172.21.2.58:8008;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name vvworker.51vv.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vvworker.51vv.com;

    ssl_certificate     /etc/nginx/ssl/51vv.com.pem;
    ssl_certificate_key /etc/nginx/ssl/51vv.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;
    client_body_timeout  120s;

    access_log /var/log/nginx/vvworker.access.log;
    error_log  /var/log/nginx/vvworker.error.log;

    # SSE 与 JSON 响应都不压缩；改由上游自行决定编码。
    gzip off;

    location / {
        proxy_pass http://vvworker_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE：事件逐条下发，不缓冲、不缓存，长任务直到 900s。
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }
}
