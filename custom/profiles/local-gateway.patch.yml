# Point DSH at the local New API gateway (relay merged into New API).
#
# Web:
#   DSH_HOME=~/.dsh-dev pnpm dsh web --patch custom/profiles/local-gateway.patch.yml
# Desktop: merge these entries into ~/.dsh-dev/profiles/desktop/cordis.patch.yml.
#
# Both origins must match, and allowLoopbackHttp admits the loopback HTTP origin
# that platformOrigin validation otherwise rejects.

- id: deepseek-account
  name: '@deepseek-ai/dsh-deepseek-account-platform'
  config:
    platformOrigin: http://127.0.0.1:13000
    inferenceOrigin: http://127.0.0.1:13000
    allowLoopbackHttp: true
    desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"

- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  config:
    baseURL: http://127.0.0.1:13000/v1
