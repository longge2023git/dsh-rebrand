# Point DSH at the deployed gateway https://ds.openrouters.org.
#
# Web:
#   DSH_HOME=~/.dsh-dev pnpm dsh web --patch custom/profiles/server-gateway.patch.yml
# Desktop: merge these entries into ~/.dsh-dev/profiles/desktop/cordis.patch.yml.
#
# Both origins must match; the deployed gateway is HTTPS, so loopback HTTP is not needed.

- id: deepseek-account
  name: '@deepseek-ai/dsh-deepseek-account-platform'
  config:
    platformOrigin: https://ds.openrouters.org
    inferenceOrigin: https://ds.openrouters.org
    usagePath: /console/log
    topUpPath: /console/topup
    desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"

- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  config:
    baseURL: https://ds.openrouters.org/v1
