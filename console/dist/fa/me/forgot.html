<!doctype html>
<html lang="fa" dir="rtl" data-default-lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek-FA</title>
<link rel="icon" type="image/svg+xml" href="/me/icon.svg">
<link rel="apple-touch-icon" href="/me/icon-180.png">
<link rel="stylesheet" href="/me/styles.css">
</head>
<body data-page="forgot" data-page-title="account.forgotTitle">
<header>
  <a class="brand" href="https://deepseekfa.com/"><img src="/me/icon.svg" alt="" width="28" height="28">DeepSeek-FA</a>
  <nav>
    <a href="/me/login" data-i18n="auth.loginLink">وارد شوید</a>
    <span class="lang">
      <a data-lang-link="fa" hreflang="fa">FA</a>
      <a data-lang-link="en" hreflang="en">EN</a>
    </span>
  </nav>
</header>

<main class="narrow">
  <h1 data-i18n="account.forgotTitle">بازیابی گذرواژه</h1>
  <p class="hint" data-i18n="account.forgotHint">ایمیل حساب را وارد کنید تا پیوند بازیابی ارسال شود.</p>
  <form id="forgot-form" class="stack" novalidate>
    <label><span data-i18n="auth.email">ایمیل</span>
      <input type="email" name="email" autocomplete="email" dir="ltr">
    </label>
    <p id="error" class="form-error" hidden></p>
    <p id="sent" class="hint ok" hidden data-i18n="account.resetSent">پیوند بازیابی ارسال شد.</p>
    <button class="button" type="submit" data-i18n="account.sendReset">ارسال پیوند</button>
  </form>
</main>

<script src="/me/dict.js"></script>
<script src="/me/app.js"></script>
<script src="/me/boot.js"></script>
</body>
</html>
