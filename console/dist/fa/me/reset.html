<!doctype html>
<html lang="fa" dir="rtl" data-default-lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek-FA</title>
<link rel="icon" type="image/svg+xml" href="/me/icon.svg">
<link rel="apple-touch-icon" href="/me/icon-180.png">
<link rel="stylesheet" href="/me/styles.css">
</head>
<body data-page="reset" data-page-title="account.resetTitle">
<header>
  <a class="brand" href="https://deepseekfa.com/"><img src="/me/icon.svg" alt="" width="28" height="28">DeepSeek-FA</a>
  <nav>
    <a href="/me/login" data-i18n="auth.loginLink">وارد شوید</a>
  </nav>
</header>

<main class="narrow">
  <h1 data-i18n="account.resetTitle">گذرواژهٔ تازه</h1>
  <p id="state" class="hint" data-i18n="common.loading">در حال بارگذاری…</p>

  <p id="confirm"><button type="button" class="button" id="reset-confirm" data-i18n="account.resetConfirm">ساخت گذرواژهٔ تازه</button></p>

  <div id="result" hidden>
    <p class="hint" data-i18n="account.resetDone">گذرواژهٔ تازه ساخته شد. آن را ذخیره کنید:</p>
    <p class="field"><code id="password" dir="ltr"></code></p>
    <p><button type="button" class="button secondary" id="copy" data-i18n="common.copy">کپی</button></p>
    <p><a class="button" href="/me/login" data-i18n="auth.signIn">ورود</a></p>
  </div>
</main>

<script src="/me/dict.js"></script>
<script src="/me/app.js"></script>
<script src="/me/boot.js"></script>
</body>
</html>
