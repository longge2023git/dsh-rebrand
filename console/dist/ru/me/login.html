<!doctype html>
<html lang="ru" dir="ltr" data-default-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek-RU</title>
<link rel="icon" type="image/svg+xml" href="/me/icon.svg">
<link rel="apple-touch-icon" href="/me/icon-180.png">
<link rel="stylesheet" href="/me/styles.css">
</head>
<body data-page="login" data-page-title="auth.signInTitle">
<header>
  <a class="brand" href="https://www.deepseek-ru.org/">
    <img src="/me/icon.svg" alt="" width="28" height="28">DeepSeek-RU
  </a>
  <nav>
    <a href="https://www.deepseek-ru.org/" data-i18n="nav.home">Главная</a>
    <a href="https://www.deepseek-ru.org/docs" data-i18n="nav.docs">Документация</a>
    <a href="/me/register" data-carry data-i18n="auth.registerLink">Зарегистрироваться</a>
    <span class="lang">
      <a data-lang-link="ru" hreflang="ru">RU</a>
      <a data-lang-link="en" hreflang="en">EN</a>
    </span>
  </nav>
</header>

<main class="narrow">
  <h1 data-i18n="auth.signInTitle">Вход</h1>
  <form id="auth-form" class="stack" novalidate>
    <label><span data-i18n="auth.emailOrUsername">Почта или имя пользователя</span>
      <input type="text" name="username" autocomplete="username">
    </label>
    <label><span data-i18n="auth.password">Пароль</span>
      <div class="field">
        <input type="password" name="password" autocomplete="current-password">
        <button type="button" class="eye" data-eye aria-pressed="false" data-i18n-aria="auth.showPassword" title="">
          <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 3l18 18M10.6 6.1A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.2 6.9A16.6 16.6 0 0 0 2 12s3.6 6 10 6c1.4 0 2.7-.3 3.8-.8"/></svg>
        </button>
      </div>
    </label>
    <p id="error" class="form-error" hidden></p>
    <button class="button" type="submit" data-i18n="auth.signIn">Войти</button>
  </form>

  <form id="twofa-form" class="stack" novalidate hidden>
    <p class="hint" data-i18n="twofa.loginHint">Нужен код: 6 цифр из приложения или один резервный код.</p>
    <label><span data-i18n="twofa.codeOrBackup">Код подтверждения или резервный код</span>
      <input id="twofa-login-code" type="text" dir="ltr" autocomplete="one-time-code">
    </label>
    <p id="twofa-login-error" class="form-error" hidden></p>
    <button class="button" type="submit" data-i18n="twofa.verify">Подтвердить</button>
    <button class="button secondary" type="button" id="twofa-back" data-i18n="twofa.back">Назад</button>
  </form>
  <p class="hint">
    <span data-i18n="auth.noAccount">Нет аккаунта?</span>
    <a href="/me/register" data-carry data-i18n="auth.registerLink">Зарегистрироваться</a>
  </p>
  <p class="hint" data-i18n="auth.loginHint">Вход через приложение тоже работает: ключ API создаётся автоматически при входе.</p>
</main>

<script src="/me/dict.js"></script>
<script src="/me/app.js"></script>
<script src="/me/boot.js"></script>
</body>
</html>
