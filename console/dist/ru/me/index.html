<!doctype html>
<html lang="ru" dir="ltr" data-default-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek-RU</title>
<link rel="stylesheet" href="/me/styles.css">
</head>
<body data-page-title="nav.usage">
<header>
  <a class="brand" href="https://www.deepseek-ru.org/">
    <img src="/me/icon.svg" alt="" width="28" height="28">DeepSeek-RU
  </a>
  <nav>
    <a href="/me/" aria-current="page" data-i18n="nav.usage">Расход</a>
    <a href="/me/keys" data-i18n="nav.keys">Ключи</a>
    <a href="https://www.deepseek-ru.org/download" data-i18n="nav.download">Скачать</a>
    <span class="lang">
      <a data-lang-link="fa" hreflang="fa">FA</a>
      <a data-lang-link="en" hreflang="en">EN</a>
    </span>
  </nav>
</header>

<main>
  <div id="auth" class="notice" hidden>
    <span data-i18n="auth.needLoginUsage">Войдите, чтобы видеть расход и ключи.</span>
    <a class="button" href="/me/login" data-i18n="auth.signIn">Войти</a>
    <a class="button secondary" href="/me/register" data-i18n="auth.signUp">Создать аккаунт</a>
  </div>

  <section id="app" hidden>
    <h1 id="who">—</h1>

    <div class="cards">
      <div class="card"><span class="label" data-i18n="usage.balance">Баланс</span><strong id="balance">—</strong></div>
      <div class="card"><span class="label" data-i18n="usage.used">Израсходовано</span><strong id="used">—</strong></div>
      <div class="card"><span class="label" data-i18n="usage.requests">Запросов</span><strong id="requests">—</strong></div>
    </div>

    <h2 data-i18n="usage.recent">Последний расход</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="usage.colTime">Время</th>
            <th data-i18n="usage.colModel">Модель</th>
            <th data-i18n="usage.colPrompt">Вход</th>
            <th data-i18n="usage.colCompletion">Выход</th>
            <th data-i18n="usage.colCost">Стоимость</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="empty" data-i18n="common.loading">Загрузка…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev" type="button" data-i18n="common.prev">Новее</button>
      <span id="pageinfo"></span>
      <button id="next" type="button" data-i18n="common.next">Старее</button>
    </div>

    <p class="hint">
      <span data-i18n="usage.keysHint">Ключ API — на странице</span>
      <a href="/me/keys" data-i18n="usage.keysLink">ключей</a>
      <span data-i18n="usage.keysHintEnd">. Ключ создаётся автоматически при входе в приложение.</span>
    </p>
  </section>
</main>

<script src="/me/dict.js"></script>
<script src="/me/app.js"></script>
<script>
  startUsage()
</script>
</body>
</html>
