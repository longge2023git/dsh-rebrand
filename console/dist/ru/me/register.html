<!doctype html>
<html lang="ru" dir="ltr" data-default-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek-RU</title>
<link rel="stylesheet" href="/me/styles.css">
</head>
<body data-page-title="auth.signUpTitle">
<header>
  <a class="brand" href="https://www.deepseek-ru.org/">
    <img src="/me/icon.svg" alt="" width="28" height="28">DeepSeek-RU
  </a>
  <nav>
    <a href="https://www.deepseek-ru.org/" data-i18n="nav.home">خانه</a>
    <a href="https://www.deepseek-ru.org/docs" data-i18n="nav.docs">راهنما</a>
    <a href="/me/login" data-i18n="auth.loginLink">وارد شوید</a>
    <span class="lang">
      <a data-lang-link="fa" hreflang="fa">FA</a>
      <a data-lang-link="en" hreflang="en">EN</a>
    </span>
  </nav>
</header>

<main class="narrow">
  <h1 data-i18n="auth.signUpTitle">ساخت حساب</h1>
  <form id="auth-form" class="stack" novalidate>
    <label><span data-i18n="auth.username">نام کاربری</span>
      <input type="text" name="username" autocomplete="username">
    </label>
    <label><span data-i18n="auth.password">گذرواژه</span>
      <input type="password" name="password" autocomplete="new-password">
    </label>
    <label><span data-i18n="auth.confirm">تکرار گذرواژه</span>
      <input type="password" name="confirm" autocomplete="new-password">
    </label>
    <p class="hint compact" data-i18n="auth.passwordHint">نام کاربری تا ۲۰ نویسه، گذرواژه ۸ تا ۲۰ نویسه.</p>
    <p id="error" class="form-error" hidden></p>
    <button class="button" type="submit" data-i18n="auth.signUp">ساخت حساب</button>
  </form>
  <p class="hint">
    <span data-i18n="auth.hasAccount">حساب دارید؟</span>
    <a href="/me/login" data-i18n="auth.loginLink">وارد شوید</a>
  </p>
</main>

<script src="/me/dict.js"></script>
<script src="/me/app.js"></script>
<script>
  startRegister()
</script>
</body>
</html>
