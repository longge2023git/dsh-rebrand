<!doctype html>
<html lang="ru" dir="ltr" data-default-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek-RU</title>
<link rel="icon" type="image/svg+xml" href="/me/icon.svg">
<link rel="apple-touch-icon" href="/me/icon-180.png">
<link rel="stylesheet" href="/me/styles.css">
</head>
<body data-page="register" data-page-title="auth.signUpTitle">
<header>
  <a class="brand" href="https://www.deepseek-ru.org/">
    <img src="/me/icon.svg" alt="" width="28" height="28">DeepSeek-RU
  </a>
  <nav>
    <a href="https://www.deepseek-ru.org/" data-i18n="nav.home">Главная</a>
    <a href="https://www.deepseek-ru.org/docs" data-i18n="nav.docs">Документация</a>
    <a href="/me/login" data-carry data-i18n="auth.loginLink">Войти</a>
    <span class="lang">
      <a data-lang-link="ru" hreflang="ru">RU</a>
      <a data-lang-link="en" hreflang="en">EN</a>
    </span>
  </nav>
</header>

<main class="narrow">
  <h1 data-i18n="auth.signUpTitle">Создание аккаунта</h1>
  <form id="auth-form" class="stack" novalidate>
    <label id="username-field" hidden><span data-i18n="auth.username">Имя пользователя</span>
      <input type="text" name="username" autocomplete="username">
    </label>
    <label><span data-i18n="auth.password">Пароль</span>
      <div class="field">
        <input type="password" name="password" autocomplete="new-password">
        <button type="button" class="eye" data-eye aria-pressed="false" data-i18n-aria="auth.showPassword" title="">
          <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 3l18 18M10.6 6.1A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.2 6.9A16.6 16.6 0 0 0 2 12s3.6 6 10 6c1.4 0 2.7-.3 3.8-.8"/></svg>
        </button>
      </div>
    </label>
    <label><span data-i18n="auth.confirm">Повторите пароль</span>
      <div class="field">
        <input type="password" name="confirm" autocomplete="new-password">
        <button type="button" class="eye" data-eye aria-pressed="false" data-i18n-aria="auth.showPassword" title="">
          <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 3l18 18M10.6 6.1A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.2 6.9A16.6 16.6 0 0 0 2 12s3.6 6 10 6c1.4 0 2.7-.3 3.8-.8"/></svg>
        </button>
      </div>
    </label>
    <label id="email-field"><span data-i18n="auth.email">Эл. почта</span>
      <input type="email" name="email" autocomplete="email" dir="ltr">
    </label>
    <label id="code-field" hidden><span data-i18n="auth.code">Код подтверждения</span>
      <div class="inline">
        <input type="text" name="code" inputmode="text" maxlength="6" autocomplete="one-time-code" dir="ltr">
        <button type="button" id="send-code" class="button secondary" data-i18n="auth.sendCode">Отправить код</button>
      </div>
    </label>

    <label><span data-i18n="invite.field">Код приглашения (необязательно)</span>
      <input type="text" name="aff" autocomplete="off" maxlength="16" dir="ltr">
    </label>
    <p class="hint compact" data-i18n="auth.passwordHint">Пароль 8–20 символов; имя пользователя создаётся из почты.</p>
    <p id="error" class="form-error" hidden></p>
    <button class="button" type="submit" data-i18n="auth.signUp">Создать аккаунт</button>
  </form>
  <p class="hint">
    <span data-i18n="auth.hasAccount">Уже есть аккаунт?</span>
    <a href="/me/login" data-carry data-i18n="auth.loginLink">Войти</a>
  </p>
</main>

<script src="/me/dict.js"></script>
<script src="/me/app.js"></script>
<script src="/me/boot.js"></script>
</body>
</html>
