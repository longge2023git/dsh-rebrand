<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل کاربری · DeepSeek-FA</title>
<link rel="stylesheet" href="/me/styles.css">
</head>
<body>
<header>
  <a class="brand" href="https://www.deepseekfa.com/">
    <img src="/me/icon.svg" alt="" width="28" height="28">DeepSeek-FA
  </a>
  <nav>
    <a href="/me/" aria-current="page">مصرف</a>
    <a href="/me/keys">کلیدها</a>
    <a href="https://deepseekfa.com/">برنامه</a>
  </nav>
</header>

<main>
  <div id="auth" class="notice" hidden>
    برای دیدن مصرف و کلیدها باید وارد شوید.
    <a class="button" href="/login">ورود</a>
  </div>

  <section id="app" hidden>
    <h1>سلام، <span id="who">—</span></h1>

    <div class="cards">
      <div class="card"><span class="label">موجودی</span><strong id="balance">—</strong></div>
      <div class="card"><span class="label">مصرف کل</span><strong id="used">—</strong></div>
      <div class="card"><span class="label">تعداد درخواست</span><strong id="requests">—</strong></div>
    </div>

    <h2>آخرین مصرف</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>زمان</th><th>مدل</th><th>ورودی</th><th>خروجی</th><th>هزینه</th><th></th></tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="empty">در حال بارگذاری…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev" type="button">جدیدتر</button>
      <span id="pageinfo"></span>
      <button id="next" type="button">قدیمی‌تر</button>
    </div>

    <p class="hint">
      برای دیدن کلید API به صفحهٔ <a href="/me/keys">کلیدها</a> بروید. کلید هنگام ورود به برنامه به‌صورت خودکار ساخته می‌شود.
    </p>
  </section>
</main>

<script src="/me/app.js"></script>
<script>
  startUsage()
</script>
</body>
</html>
