<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" data-default-lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{brand}}</title>
<link rel="stylesheet" href="/me/styles.css">
</head>
<body data-page-title="auth.signInTitle">
<header>
  <a class="brand" href="{{site}}/">
    <img src="/me/icon.svg" alt="" width="28" height="28">{{brand}}
  </a>
  <nav>
    <a href="{{site}}/" data-i18n="nav.home">خانه</a>
    <a href="{{site}}/docs" data-i18n="nav.docs">راهنما</a>
    <a href="/me/register" data-i18n="auth.registerLink">ثبت‌نام کنید</a>
    <span class="lang">
      <a data-lang-link="fa" hreflang="fa">FA</a>
      <a data-lang-link="en" hreflang="en">EN</a>
    </span>
  </nav>
</header>

<main class="narrow">
  <h1 data-i18n="auth.signInTitle">ورود</h1>
  <form id="auth-form" class="stack" novalidate>
    <label><span data-i18n="auth.username">نام کاربری</span>
      <input type="text" name="username" autocomplete="username">
    </label>
    <label><span data-i18n="auth.password">گذرواژه</span>
      <input type="password" name="password" autocomplete="current-password">
    </label>
    <p id="error" class="form-error" hidden></p>
    <button class="button" type="submit" data-i18n="auth.signIn">ورود</button>
  </form>
  <p class="hint">
    <span data-i18n="auth.noAccount">حساب ندارید؟</span>
    <a href="/me/register" data-i18n="auth.registerLink">ثبت‌نام کنید</a>
  </p>
  <p class="hint" data-i18n="auth.loginHint">با ورود به برنامه هم می‌توانید وارد شوید.</p>
</main>

<script src="/me/dict.js"></script>
<script src="/me/app.js"></script>
<script>
  startLogin()
</script>
</body>
</html>
