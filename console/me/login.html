<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود · DeepSeek-FA</title>
<link rel="stylesheet" href="/me/styles.css">
</head>
<body>
<header>
  <a class="brand" href="https://www.deepseekfa.com/">
    <img src="/me/icon.svg" alt="" width="28" height="28">DeepSeek-FA
  </a>
  <nav>
    <a href="https://www.deepseekfa.com/">خانه</a>
    <a href="https://www.deepseekfa.com/docs">راهنما</a>
    <a href="/me/register">ثبت‌نام</a>
  </nav>
</header>

<main class="narrow">
  <h1>ورود</h1>
  <form id="auth-form" class="stack" novalidate>
    <label>نام کاربری
      <input type="text" name="username" autocomplete="username">
    </label>
    <label>گذرواژه
      <input type="password" name="password" autocomplete="current-password">
    </label>
    <p id="error" class="form-error" hidden></p>
    <button class="button" type="submit">ورود</button>
  </form>
  <p class="hint">حساب ندارید؟ <a href="/me/register">ثبت‌نام کنید</a></p>
  <p class="hint">با ورود به برنامه هم می‌توانید وارد شوید؛ کلید API هنگام ورود به‌صورت خودکار ساخته می‌شود.</p>
</main>

<script src="/me/app.js"></script>
<script>
  startLogin()
</script>
</body>
</html>
