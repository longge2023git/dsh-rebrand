services:
  new-api:
    # Pinned to the tested baseline; this is the only service started by default.
    image: ${NEWAPI_IMAGE:-calciumion/new-api:v0.10.9}
    container_name: dsh-newapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      TZ: Asia/Shanghai
      # Optional: make upstream calls through a host-side proxy.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,new-api}
      FILE_CHANNEL_ID: ${FILE_CHANNEL_ID:-}
      DSH_ALLOW_REGISTRATION: ${DSH_ALLOW_REGISTRATION:-true}
      DSH_PUBLIC_ORIGIN: ${DSH_PUBLIC_ORIGIN:-http://127.0.0.1:13000}
      DSH_NEW_USER_QUOTA: ${DSH_NEW_USER_QUOTA:-1000000000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/new-api:/data

  relay:
    # Archived reference only. `docker compose up -d` does not start this profile.
    profiles: ["relay-reference"]
    build: .
    container_name: dsh-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:18082"
    env_file:
      - .env
    environment:
      NEWAPI_BASE_URL: http://new-api:3000
      DATA_DIR: /data
    volumes:
      - ./data/relay:/data
    depends_on:
      - new-api
